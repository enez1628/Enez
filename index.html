<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melike ve Enez</title>
  <style>
    body {
      background-color: #fff0f5;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      color: #e60073;
      font-size: 3em;
    }
    p {
      font-size: 1.4em;
      color: #333;
      max-width: 600px;
      margin: auto;
    }
    img {
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
      border-radius: 10px;
    }
    audio {
      margin-top: 30px;
    }
    @media (max-width: 480px) {
      h1 { font-size: 2em; }
      p { font-size: 1.1em; padding: 0 15px; }
    }
  </style>
</head>
<body>
  <h1>💖 Melike & Enez 💖</h1>
  <p>Sen bu dünyaya gönderilmiş en güzel mucizesin...<br>
     Her sabah seninle uyanmak yeniden doğmak gibi...<br>
     Enez seni her şeyinle, sonsuz seviyor...</p>

  <img src="https://i.hizliresim.com/cvvp0po.jpeg" alt="Melike ve Enez"/>

  <audio id="muzik" controls autoplay loop muted>
    <source src="https://dl.sndup.net/3s9n/Ahmet_Kaya_Siir.mp3" type="audio/mpeg">
    Tarayıcınız müzik çalmayı desteklemiyor.
  </audio>

  <script>
    // Tarayıcılar sesli autoplay'i engeller; ilk dokunuşta sesi açıp başlatıyoruz.
    const muzik = document.getElementById('muzik');
    function sesiBaslat() {
      muzik.muted = false;
      muzik.play().catch(function () {});
      document.removeEventListener('click', sesiBaslat);
      document.removeEventListener('touchstart', sesiBaslat);
    }
    document.addEventListener('click', sesiBaslat);
    document.addEventListener('touchstart', sesiBaslat);
  </script>
</body>
</html>
